<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WOZ 训练系统</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./css/map-builder.css">
    <link rel="stylesheet" href="./css/custom.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        /* 注释掉原来的header样式 */
        /* .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 60px;
            background-color: #2c3e50;
            color: white;
            flex-shrink: 0;
        }
        .header .logo {
            font-size: 1.5rem;
        }
        .header .logo span {
            margin-left: 10px;
        } */
        
        /* 悬浮监听按钮样式 */
        .floating-mic-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .floating-mic-btn {
            background-color: #2c3e50;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .floating-mic-btn:hover {
            background-color: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        .floating-mic-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }
        
        .main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            height: 100vh; /* 占满整个视口高度 */
        }
        .sidebar {
            width: 100px;
            background-color: #34495e;
            color: white;
            padding-top: 0; /* Removed padding-top */
            flex-shrink: 0;
        }
        .sidebar .logo {
            display: none; /* Hide original logo in sidebar */
        }
        .content-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div id="notification-container"></div>
    <!-- <div class="header">
        <div class="logo">
            <i class="fas fa-robot"></i>
            <span>WOZ 训练系统</span>
        </div>
        <div class="header-controls">
            <button id="mic-toggle-btn" class="btn btn-secondary">
                <i class="fas fa-microphone-slash"></i>
                <span>开启监听</span>
            </button>
        </div>
    </div> -->
    
    <!-- 悬浮监听按钮 -->
    <div class="floating-mic-container">
        <button id="mic-toggle-btn" class="btn btn-secondary floating-mic-btn">
            <i class="fas fa-microphone-slash"></i>
            <span></span>
        </button>
    </div>
    <div class="main-container">
        <div class="sidebar">
            <!-- The logo is now in the main header -->
            <ul class="nav-menu">
                <li>
                    <a href="#" data-page="participant_management">
                        <i class="fas fa-users"></i> 被试管理
                    </a>
                </li>
                <li>
                    <a href="#" data-page="map_management">
                        <i class="fas fa-map"></i> 地图管理
                    </a>
                </li>
                <li>
                    <a href="#" data-page="experiment_control">
                        <i class="fas fa-gamepad"></i> 实验控制
                    </a>
                </li>
                <li>
                    <a href="#" data-page="session_results">
                        <i class="fas fa-chart-bar"></i> 实验结果
                    </a>
                </li>
            </ul>
        </div>
        <div class="content-area" id="content-area">
            <!-- 页面内容将在这里动态加载 -->
        </div>
    </div>
    <!-- 使用ES6模块 -->
    <script type="module" src="./renderer.js"></script>
    <!-- 实验开始模态框 -->
    <div id="experiment-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">开始新的实验</h5>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="participant-select">选择被试:</label>
                    <select id="participant-select" class="form-control">
                        <!-- 选项将动态填充 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="map-select">选择场地:</label>
                    <select id="map-select" class="form-control">
                        <!-- 选项将动态填充 -->
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" data-confirm="modal">确认开始</button>
            </div>
        </div>
    </div>
    <!-- 创建地图模态框 -->
    <div id="create-map-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">创建新地图</h5>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body">
                <form id="create-map-form">
                    <div class="form-group">
                        <label for="map-name-input">地图名称:</label>
                        <input type="text" id="map-name-input" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="map-desc-input">地图描述:</label>
                        <textarea id="map-desc-input" class="form-control" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" data-confirm="modal">确认创建</button>
            </div>
        </div>
    </div>
    <!-- 添加被试模态框 -->
    <div id="add-participant-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加新被试</h5>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body">
                <form id="add-participant-form">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="participant-name-input">姓名: <span class="text-danger">*</span></label>
                                <input type="text" id="participant-name-input" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="participant-year-input">年龄 (岁): <span class="text-danger">*</span></label>
                                <input type="number" id="participant-year-input" class="form-control" min="0" max="18" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="participant-month-input">年龄 (月): <span class="text-danger">*</span></label>
                                <input type="number" id="participant-month-input" class="form-control" min="0" max="11" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="parent-name-input">家长姓名: <span class="text-danger">*</span></label>
                                <input type="text" id="parent-name-input" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="parent-phone-input">联系电话: <span class="text-danger">*</span></label>
                                <input type="tel" id="parent-phone-input" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="diagnostic-info-input">诊断信息:</label>
                        <textarea id="diagnostic-info-input" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="preference-info-input">偏好信息:</label>
                        <textarea id="preference-info-input" class="form-control" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" data-confirm="modal">确认添加</button>
            </div>
        </div>
    </div>
</body>
</html>
