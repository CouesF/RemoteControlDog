<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Microphone Broadcast</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); width: 90%; max-width: 450px; }
        h1 { margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        .status { display: flex; align-items: center; justify-content: center; margin-bottom: 25px; font-size: 18px; font-weight: 500; }
        .status-light { width: 12px; height: 12px; background-color: #f44336; border-radius: 50%; margin-right: 10px; transition: background-color 0.3s; }
        .status-light.live { background-color: #4CAF50; animation: pulse 1.5s infinite; }
        .controls button { font-size: 16px; padding: 12px 24px; margin: 0 10px; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
        #startButton { background-color: #4CAF50; color: white; }
        #stopButton { background-color: #f44336; color: white; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* New styles for the stats display */
        .stats-container { margin-top: 30px; text-align: left; background-color: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .stats-container h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px;}
        #statsDisplay { font-family: 'Courier New', Courier, monospace; font-size: 14px; white-space: pre-wrap; margin: 0; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Microphone Broadcast</h1>
        <div class="status">
            <div id="statusLight" class="status-light"></div>
            <span id="statusText">Stopped</span>
        </div>
        <div class="controls">
            <button id="startButton">Start Streaming</button>
            <button id="stopButton" disabled>Stop Streaming</button>
        </div>

        <div class="stats-container">
            <h3>Live Latency Stats</h3>
            <pre id="statsDisplay">-- Not Connected --</pre>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const statusLight = document.getElementById('statusLight');
        const statusText = document.getElementById('statusText');
        const statsDisplay = document.getElementById('statsDisplay');

        let audioPlayer = null;
        let eventSource = null;

        function setStreamingState(isStreaming) {
            statusLight.classList.toggle('live', isStreaming);
            statusText.textContent = isStreaming ? 'Live' : 'Stopped';
            startButton.disabled = isStreaming;
            stopButton.disabled = !isStreaming;
            if (!isStreaming) {
                statsDisplay.textContent = '-- Not Connected --';
            }
        }

        startButton.addEventListener('click', async () => {
            await fetch('/start', { method: 'POST' });
            
            audioPlayer = new Audio('/audio');
            try {
                await audioPlayer.play();
                console.log("Audio playback has started.");
                setStreamingState(true);

                // --- Start listening for stats ---
                eventSource = new EventSource('/stats');
                
                eventSource.onmessage = function(event) {
                    const stats = JSON.parse(event.data);
                    const clientTimestamp = Date.now();
                    const networkLatency = clientTimestamp - stats.server_timestamp;

                    const statsText = 
`Server Capture: ${stats.capture_ms.toFixed(2).padStart(5, ' ')} ms\n` +
`Chunk Size    : ${stats.chunk_size_bytes.toString().padStart(5, ' ')} bytes\n` +
`Network (est.): ${networkLatency.toFixed(0).padStart(5, ' ')} ms`;
                    statsDisplay.textContent = statsText;
                };

                eventSource.onerror = function() {
                    statsDisplay.textContent = 'Error: Connection to stats stream lost.';
                    eventSource.close();
                };

            } catch (err) {
                console.error("Audio playback failed:", err);
                alert("Audio playback failed. Please check browser permissions and speaker settings.");
                setStreamingState(false);
                fetch('/stop', { method: 'POST' });
            }
        });

        stopButton.addEventListener('click', async () => {
            await fetch('/stop', { method: 'POST' });
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer.src = '';
                audioPlayer = null;
            }
            if (eventSource) {
                eventSource.close(); // Close the stats connection
                eventSource = null;
            }
            setStreamingState(false);
            console.log("Audio stream stopped.");
        });

        setStreamingState(false);
    </script>
</body>
</html>
