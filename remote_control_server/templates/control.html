<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程控制 - 机器狗实验</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-label {
            color: #666;
            margin-bottom: 5px;
        }

        .status-value {
            font-weight: 600;
            color: #333;
        }

        .connection-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .connection-status.connecting {
            background: #fff3cd;
            color: #856404;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-button {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .control-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .control-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .control-button:active:before {
            left: 100%;
        }

        .success-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .success-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .failure-btn {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }

        .failure-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .control-button {
                padding: 18px;
                font-size: 1.1rem;
                min-height: 70px;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">🤖 远程控制</h1>
            <p class="subtitle">机器狗实验控制面板</p>
        </div>

        <div class="connection-status disconnected" id="connectionStatus">
            🔴 连接中...
        </div>

        <div class="status">
            <div class="status-item">
                <div class="status-label">网页客户端</div>
                <div class="status-value" id="webClients">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">Electron客户端</div>
                <div class="status-value" id="electronClients">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">最后活动</div>
                <div class="status-value" id="lastActivity">--:--</div>
            </div>
        </div>

        <div class="controls">
            <button class="control-button success-btn" id="jaSuccessBtn" disabled>
                ✅ JA成功
            </button>
            <button class="control-button failure-btn" id="jaFailureBtn" disabled>
                ❌ JA失败
            </button>
        </div>

        <div class="message" id="messageContainer"></div>

        <div class="footer">
            <p>Token: {{ token }}</p>
            <p>连接状态将自动更新</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        class RemoteController {
            constructor() {
                this.socket = null;
                this.isConnected = false;
                this.isAuthenticated = false;
                this.token = '{{ token }}';
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.connect();
                this.startHeartbeat();
            }

            connect() {
                this.updateConnectionStatus('connecting', '🟡 连接中...');
                
                this.socket = io();
                
                this.socket.on('connect', () => {
                    console.log('WebSocket connected');
                    this.isConnected = true;
                    this.reconnectAttempts = 0;
                    this.authenticate();
                });

                this.socket.on('disconnect', () => {
                    console.log('WebSocket disconnected');
                    this.isConnected = false;
                    this.isAuthenticated = false;
                    this.updateConnectionStatus('disconnected', '🔴 连接断开');
                    this.updateButtonStates(false);
                    this.attemptReconnect();
                });

                this.socket.on('auth_response', (data) => {
                    if (data.success) {
                        this.isAuthenticated = true;
                        this.updateConnectionStatus('connected', '🟢 已连接');
                        this.updateButtonStates(true);
                        this.showMessage('认证成功，可以开始控制', 'success');
                    } else {
                        this.showMessage(`认证失败：${data.message}`, 'error');
                        this.updateConnectionStatus('disconnected', '🔴 认证失败');
                    }
                });

                this.socket.on('command_response', (data) => {
                    if (data.success) {
                        this.showMessage(data.message, 'success');
                    } else {
                        this.showMessage(`错误：${data.message}`, 'error');
                    }
                });

                this.socket.on('command_result', (data) => {
                    const status = data.success ? 'success' : 'error';
                    this.showMessage(`执行结果：${data.message}`, status);
                });

                this.socket.on('status_update', (data) => {
                    this.updateStatusDisplay(data);
                });

                this.socket.on('pong', (data) => {
                    this.updateLastActivity();
                });

                this.socket.on('connect_error', (error) => {
                    console.error('Connection error:', error);
                    this.showMessage('连接错误，请检查网络', 'error');
                });
            }

            authenticate() {
                this.socket.emit('auth', {
                    client_type: 'web',
                    token: this.token
                });
            }

            attemptReconnect() {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    this.updateConnectionStatus('connecting', `🟡 重连中 (${this.reconnectAttempts}/${this.maxReconnectAttempts})`);
                    
                    setTimeout(() => {
                        this.connect();
                    }, 2000 * this.reconnectAttempts);
                } else {
                    this.updateConnectionStatus('disconnected', '🔴 连接失败');
                    this.showMessage('无法连接到服务器，请刷新页面重试', 'error');
                }
            }

            sendCommand(action) {
                if (!this.isAuthenticated) {
                    this.showMessage('未认证，无法发送命令', 'error');
                    return;
                }

                const button = action === 'ja_success' ? 
                    document.getElementById('jaSuccessBtn') : 
                    document.getElementById('jaFailureBtn');
                
                // 添加加载状态
                const originalText = button.innerHTML;
                button.innerHTML = originalText + '<span class="loading"></span>';
                button.disabled = true;

                this.socket.emit('control_command', {
                    action: action,
                    timestamp: Date.now()
                });

                // 3秒后恢复按钮状态
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.disabled = false;
                }, 3000);
            }

            bindEvents() {
                document.getElementById('jaSuccessBtn').addEventListener('click', () => {
                    this.sendCommand('ja_success');
                });

                document.getElementById('jaFailureBtn').addEventListener('click', () => {
                    this.sendCommand('ja_failure');
                });
            }

            updateConnectionStatus(status, text) {
                const statusElement = document.getElementById('connectionStatus');
                statusElement.className = `connection-status ${status}`;
                statusElement.textContent = text;
            }

            updateButtonStates(enabled) {
                document.getElementById('jaSuccessBtn').disabled = !enabled;
                document.getElementById('jaFailureBtn').disabled = !enabled;
            }

            updateStatusDisplay(data) {
                document.getElementById('webClients').textContent = data.web_clients_count || 0;
                document.getElementById('electronClients').textContent = data.electron_clients_count || 0;
                this.updateLastActivity();
            }

            updateLastActivity() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById('lastActivity').textContent = timeString;
            }

            showMessage(text, type = 'info') {
                const container = document.getElementById('messageContainer');
                container.className = `message ${type}`;
                container.textContent = text;
                container.classList.add('show');

                setTimeout(() => {
                    container.classList.remove('show');
                }, 5000);
            }

            startHeartbeat() {
                setInterval(() => {
                    if (this.isConnected) {
                        this.socket.emit('ping', { timestamp: Date.now() });
                    }
                }, 30000); // 每30秒发送一次心跳
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            new RemoteController();
        });
    </script>
</body>
</html>
